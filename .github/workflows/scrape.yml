name: sweep

# One deep sweep per day, and an optional focused watch in the afternoon.
#
# The repo is public, so Actions minutes are free and depth is not rationed by
# budget. What constrains it is pelikan.cz, and the shape of that constraint is
# now measured rather than assumed.
#
# pelikan.cz answers about 120 searches per runner and then stops answering at
# all. Measured four ways on 20 Aug, and the first three readings of it were
# wrong:
#
#   3 runners, no recycling:      120 answered *each* (360 total)
#   1 runner,  no recycling:      120 answered
#   1 runner,  recycle every 40:  120 answered
#   5 runners, 105 each:          483 answered - coverage 1.0
#
# Replacing the whole browser changes nothing, so it is not a cookie and not a
# session; what is constant within a runner and differs between runners is the
# address. The cliff is hard rather than a slowdown - a steady ten seconds a
# search right through [120/483], then half an hour of silence.
#
# So every shard must stay under ~120 searches. That is no longer a number kept
# here: `scripts/plan_sweep.py` plans each trip at the depth this run will use
# and asks `planner.shards_for` how many runners it needs, so the matrix carries
# a count per trip. It gives back 5 for the 483-search shape that has finished
# whole every night since 20 Aug, and 1 for the 66-search shape that pinning the
# Japan crossing produced - which the old fixed 5 would have split 13 apiece.
#
# Do not trust the old "350 searches, zero timeouts" note. That run was cancelled
# at the 90-minute ceiling and ran the code that logged a timed-out search as an
# empty route, so it could not have reported anything but zero.
#
# Timing comes from the probe, detrended against each route-day median:
# 01:00-03:00 UTC runs ~2.2% below the day median and 18:00-22:00 ~0.6% above,
# so a true evening slot would systematically sample the day high. 02:00 lands
# results before you wake; 13:00 (~15:00 local) is near-median and actionable
# while you are awake to act on it.
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario id (default: every enabled scenario)'
        required: false
      depth:
        description: 'quick | standard | deep (default: deep)'
        required: false
      shards:
        description: 'Force a runner count. Leave blank; it is sized per trip.'
        required: false

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
      jobs: ${{ steps.pick.outputs.jobs }}
      depth: ${{ steps.pick.outputs.depth }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pick
        env:
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_DEPTH: ${{ inputs.depth }}
          INPUT_SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          DEPTH="${INPUT_DEPTH:-deep}"
          echo "depth=$DEPTH" >> "$GITHUB_OUTPUT"
          FOCUSED=""
          if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            FOCUSED="--focused"
          fi
          # --depth is the depth the sweep will run at, not the one on the file.
          # Sizing a trip saved as `quick` and dispatched as `deep` from the file
          # would hand a seven-times bigger plan to one runner.
          python scripts/plan_sweep.py --depth "$DEPTH" --shards "${INPUT_SHARDS:-0}" --only "${INPUT_SCENARIO:-}" $FOCUSED >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  sweep:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    strategy:
      # One throttled shard must not bin the others. A sweep missing part of its
      # date grid is worth committing and says so through coverage; nothing at
      # all is what the thirteen cancelled nights produced.
      fail-fast: false
      # One entry per runner, each carrying the count it is a share of. A cross
      # product of trips and shard indices cannot give one trip five runners and
      # another one, which is exactly what sizing per trip needs.
      matrix:
        include: ${{ fromJson(needs.plan.outputs.jobs) }}
    runs-on: ubuntu-latest
    # A ceiling, never the budget. The budget is --max-minutes below, which the
    # sweep enforces on itself so it always reaches the upload step.
    #
    # This was the budget once, set from an estimate wrong by half, and thirteen
    # consecutive nightly runs -- 8 to 20 August -- swept cleanly for 90 minutes,
    # were cancelled, and committed nothing. Neither the runs nor the data ever
    # said so; gh run list did. It now sits well above the budget.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Report the planned cost before spending it
        run: |
          python -m src.cli sweep --scenario "${{ matrix.scenario }}" --depth "${{ needs.plan.outputs.depth }}" --shard "${{ matrix.shard }}/${{ matrix.shard_count }}" --dry-run || true

      - name: Sweep this shard
        env:
          # A ceiling, not an expectation: a shard is capped near 105 searches
          # by the sizing above, which takes ~20 min. Generous so a slow night
          # still finishes, low enough that a stuck shard gives up rather than
          # running into timeout-minutes.
          SWEEP_BUDGET_MIN: 140
        run: |
          set -euo pipefail
          python -m src.cli sweep --scenario "${{ matrix.scenario }}" --depth "${{ needs.plan.outputs.depth }}" --shard "${{ matrix.shard }}/${{ matrix.shard_count }}" --data-dir shard-out --max-minutes "$SWEEP_BUDGET_MIN"

      - name: Hand the shard to the merge
        # Always: legs are appended as they are found, so there is nearly always
        # something real on disk even when the step above failed, and an hour of
        # measurements against prices that cannot be re-observed is worth keeping
        # whatever killed the run.
        #
        # shard-out/, not data/: uploading data/sweeps/<id>/ handed the merge the
        # whole committed history -- 24 directories, seven of them sweeps from a
        # fortnight earlier -- and it refused to merge them, which is the only
        # reason the first sharded run committed nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.scenario }}-shard-${{ matrix.shard }}
          path: shard-out/sweeps/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 3

  merge:
    needs: [plan, sweep]
    # Always, for the same reason: two shards out of three is a sweep with holes
    # in its date grid, which coverage reports honestly. Losing them all is
    # another blank night.
    if: always() && needs.plan.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Serial, because every trip commits to the same branch.
      max-parallel: 1
      matrix:
        scenario: ${{ fromJson(needs.plan.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect the shards
        uses: actions/download-artifact@v4
        with:
          pattern: sweep-${{ matrix.scenario }}-shard-*
          path: shards

      - name: Stitch them into one sweep and report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python -m src.cli merge-shards --scenario "${{ matrix.scenario }}" --from shards

      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # No || true on git add: a persistence failure must be loud. A blanket
          # data/ ignore rule silently discarded every result for months
          # precisely because that error was being swallowed.
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          git commit -m "chore(data): sweep ${{ matrix.scenario }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Rebase before pushing. probe.yml runs every two hours, which includes
          # the 02:00 slot this fires on, and pushes to the same branch. The two
          # concurrency groups differ, so nothing serialises them: a rejected
          # push would throw away a sweep that cannot be re-run against the same
          # prices. Retried because the probe may land twice inside one sweep.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto origin"
            git pull --rebase --autostash
          done
          echo "::error::could not push sweep results after 3 attempts"
          exit 1
