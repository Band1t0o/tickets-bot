name: sweep

# One deep sweep per day, moving to two once the first is proven healthy.
#
# The repo is public, so Actions minutes are free and depth is no longer
# rationed by budget. What still constrains it is pelikan.cz: this client has
# already been throttled into 58 of 93 timeouts in a single sweep, and a
# starved sweep is worse than no sweep - it spends time, commits thin results,
# and its price is not comparable with anything. Hence the health gate below,
# and hence workers/delay stay where they are. Free minutes are not a reason to
# hammer the site harder.
#
# Timing comes from the probe, detrended against each route-day's median:
# 01:00-03:00 UTC runs ~2.2% below the day's median and 18:00-22:00 ~0.6% above,
# so a true evening slot would systematically sample the day's high. 02:00 lands
# results before you wake; 13:00 (~15:00 local) is near-median and actionable
# while you are awake to act on it.
on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC, deep
    # Second slot, deliberately not enabled yet. Turn it on only once the 02:00
    # deep runs hold >=8 legs/search at 21/21 route coverage for a few days --
    # doubling the load before that is the most likely way to make the data
    # worse rather than better.
    # - cron: '0 13 * * *'   # 13:00 UTC, deep, gated on the morning run
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario id (default: every enabled scenario)'
        required: false
      depth:
        description: 'quick | standard | deep (default: the scenario setting)'
        required: false

permissions:
  contents: write

concurrency:
  # A queued run must not start while the previous one is still committing.
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A deep sweep is ~97 min at 2 workers, so 90 would have killed every one of
    # them a few minutes from the end. Still a ceiling, not a budget: without it
    # one hung browser runs until GitHub's own 6-hour limit.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('requirements.txt') }}

      # chromium only: the providers never touch firefox or webkit, and
      # installing all three is most of the setup cost.
      - run: python -m playwright install --with-deps chromium

      - name: Report the planned cost before spending it
        run: |
          for f in scenarios/*.json; do
            id=$(basename "$f" .json)
            python -m src.cli sweep --scenario "$id" --dry-run || true
          done

      # Only the afternoon run is gated: the morning one has nothing ahead of it
      # to judge, and the whole point is not to follow a starved sweep with
      # another. Sets SKIP rather than failing, so a skipped run reads as a
      # decision in the log and not as breakage.
      - name: Ask the morning sweep whether another is worth running
        if: github.event.schedule == '0 13 * * *'
        id: gate
        run: |
          for f in scenarios/*.json; do
            id=$(basename "$f" .json)
            if ! python -m src.cli health-gate --scenario "$id" --min-legs-per-search 6; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

      - name: Run sweep
        if: steps.gate.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          # Deep: every departure date, ~615 searches, ~97 min. Affordable now
          # the repo is public, and it is what the date axis needed - at `quick`
          # the grid is 7 days and the cheapest day is only known to +/-3, on a
          # curve whose cheapest and dearest days differ by 29%.
          DEPTH="${INPUT_DEPTH:-deep}"

          if [ -n "${INPUT_SCENARIO:-}" ]; then
            python -m src.cli sweep --scenario "$INPUT_SCENARIO" --depth "$DEPTH"
            exit 0
          fi

          python - <<'PY' > /tmp/enabled.txt
          from src.scenario import load_scenarios
          print("\n".join(s.id for s in load_scenarios("scenarios") if s.enabled))
          PY

          while read -r id; do
            [ -z "$id" ] && continue
            echo "::group::sweep $id ($DEPTH)"
            python -m src.cli sweep --scenario "$id" --depth "$DEPTH"
            echo "::endgroup::"
          done < /tmp/enabled.txt

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # No `|| true` on `git add`: a persistence failure must be loud.
          # A blanket `data/` ignore rule silently discarded every result for
          # months precisely because that error was being swallowed.
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          git commit -m "chore(data): sweep $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Rebase before pushing. probe.yml runs `0 */2 * * *`, which includes
          # the 02:00 slot this workflow fires on, and pushes to the same branch.
          # The two concurrency groups differ, so nothing serialises them: a
          # rejected push would throw away ~97 minutes of sweeping that cannot be
          # re-run against the same prices. Retried because the probe may land
          # twice inside one deep sweep.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto origin"
            git pull --rebase --autostash
          done
          echo "::error::could not push sweep results after 3 attempts"
          exit 1
